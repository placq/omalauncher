name: Linux face prototype APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/linuxapp-lifecycle]
    paths:
      - 'app/**'
      - 'owl/**'
      - 'prototype/**'
      - '.github/workflows/embedded-prototype.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-37.0" "cmake;3.22.1"
      - name: Include Linux runtime
        run: ./scripts/fetch-proot.sh
      - name: Test and build
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar :app:assembleEmbedded :app:lintDebug
      - name: Verify isolated application ID
        run: |
          apk=app/build/outputs/apk/embedded/app-embedded.apk
          package=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")
          test "$package" = "dev.omalauncher.embedded"
      - name: Verify complete Linux payload
        run: |
          python3 - <<'PYCODE'
          import zipfile
          apk = "app/build/outputs/apk/embedded/app-embedded.apk"
          required = {"libproot.so", "libproot-loader.so", "libtalloc.so", "libandroid-shmem.so", "libwlbridge.so"}
          with zipfile.ZipFile(apk) as archive:
              missing = required - {path.rsplit("/", 1)[-1] for path in archive.namelist() if path.startswith("lib/arm64-v8a/")}
              if missing:
                  raise SystemExit(f"Incomplete device-test APK; missing: {sorted(missing)}")
          print("Full arm64 Linux runtime verified")
          PYCODE
      - name: Check demo face
        run: java -jar owl/build/cli/owl.jar check prototype/linux-app.owl
      - name: Check self-contained demo
        run: python prototype/test-demo.py
      - name: Package device test bundle
        run: |
          mkdir -p dist/linux-face-prototype/prototype
          cp app/build/outputs/apk/embedded/app-embedded.apk dist/linux-face-prototype/
          cp prototype/DEVICE-TESTS.md dist/linux-face-prototype/README-TESTING.md
          cp prototype/collect-linuxapp-logs.sh prototype/linux-app.owl prototype/linux-app-demo.py dist/linux-face-prototype/prototype/
          printf 'commit=%s\napplicationId=dev.omalauncher.embedded\nlinuxRuntime=verified\n' "$GITHUB_SHA" > dist/linux-face-prototype/BUILD.txt
          (cd dist/linux-face-prototype && sha256sum app-embedded.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-face-prototype
          path: dist/linux-face-prototype/
          if-no-files-found: error
