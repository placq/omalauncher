name: Linux face prototype APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'owl/**'
      - 'prototype/**'
      - '.github/workflows/embedded-prototype.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-37.0" "cmake;3.22.1"
      - name: Include Linux runtime
        run: ./scripts/fetch-proot.sh
      - name: Test and build
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar :app:assembleEmbedded :app:lintDebug
      - name: Verify isolated application ID
        run: |
          apk=app/build/outputs/apk/embedded/app-embedded.apk
          package=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")
          test "$package" = "dev.omalauncher.embedded"
      - name: Check demo face
        run: java -jar owl/build/cli/owl.jar check prototype/linux-app.owl
      - name: Check self-contained demo
        run: python prototype/test-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-face-prototype
          path: |
            app/build/outputs/apk/embedded/*.apk
            prototype/
          if-no-files-found: error
