name: GBA prototype APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-37.0" "cmake;3.22.1"
      - name: Include Linux runtime
        run: ./scripts/fetch-proot.sh
      - name: Test and build
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar :app:assembleDebug
      - name: Check prototype face
        run: java -jar owl/build/cli/owl.jar check prototype/pocket-gba.owl
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-gba-prototype
          path: |
            app/build/outputs/apk/debug/*.apk
            prototype/
